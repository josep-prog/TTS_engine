<!doctype html>
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinyarwanda TTS Listening Test</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e2dc; --accent:#1f6f5c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#9a9993; --card:#1f1f1d; --line:#33332f; --accent:#5cc2a6; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .text { font-weight:600; margin-bottom:10px; }
  .clip { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .clip:first-of-type { border-top:0; }
  .label { width:24px; font-weight:700; color:var(--accent); }
  audio { height:36px; flex:1 1 260px; min-width:0; }
  .stars button { border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:6px; width:34px; height:34px; cursor:pointer; }
  .stars button.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .bar { position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .bar button { background:var(--accent); color:var(--bg); border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; }
  #progress { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Kinyarwanda TTS listening test</h1>
  <p class="lead">Rate how natural each clip sounds: 1 = clearly a machine, 5 = sounds exactly like a native speaker. System names are hidden and the order changes per sentence.</p>
  <label>Your name: <input id="rater" placeholder="e.g. Aline"></label>
  <div id="list" style="margin-top:16px"></div>
</main>
<div class="bar"><span id="progress"></span><button id="export">Download ratings (CSV)</button></div>
<script>
const DATA = [{"i": 0, "text": "Muraho, amakuru yawe?", "clips": [{"sys": "mms-norm", "src": "mms-norm/000.wav"}, {"sys": "mms", "src": "mms/000.wav"}]}, {"i": 1, "text": "Nitwa Nishimwe, ntuye i Kigali.", "clips": [{"sys": "mms-norm", "src": "mms-norm/001.wav"}, {"sys": "mms", "src": "mms/001.wav"}]}, {"i": 2, "text": "Mwaramutse neza! Mwiriwe mute?", "clips": [{"sys": "mms", "src": "mms/002.wav"}, {"sys": "mms-norm", "src": "mms-norm/002.wav"}]}, {"i": 3, "text": "Uyu munsi ikirere kirakeye, nta mvura iri bugwe.", "clips": [{"sys": "mms-norm", "src": "mms-norm/003.wav"}, {"sys": "mms", "src": "mms/003.wav"}]}, {"i": 4, "text": "Ejo nzajya ku isoko kugura imboga n'imbuto.", "clips": [{"sys": "mms-norm", "src": "mms-norm/004.wav"}, {"sys": "mms", "src": "mms/004.wav"}]}, {"i": 5, "text": "Ese wowe ukunda kurya iki?", "clips": [{"sys": "mms-norm", "src": "mms-norm/005.wav"}, {"sys": "mms", "src": "mms/005.wav"}]}, {"i": 6, "text": "Abana bagiye ku ishuri mu gitondo.", "clips": [{"sys": "mms-norm", "src": "mms-norm/006.wav"}, {"sys": "mms", "src": "mms/006.wav"}]}, {"i": 7, "text": "Murakoze cyane ku bufasha bwanyu.", "clips": [{"sys": "mms-norm", "src": "mms-norm/007.wav"}, {"sys": "mms", "src": "mms/007.wav"}]}, {"i": 8, "text": "Nimuze twubake igihugu cyacu.", "clips": [{"sys": "mms", "src": "mms/008.wav"}, {"sys": "mms-norm", "src": "mms-norm/008.wav"}]}, {"i": 9, "text": "Inama izaba ku wa kabiri saa tatu za mu gitondo.", "clips": [{"sys": "mms-norm", "src": "mms-norm/009.wav"}, {"sys": "mms", "src": "mms/009.wav"}]}, {"i": 10, "text": "Igiciro cy'umuceri cyazamutseho 15%.", "clips": [{"sys": "mms-norm", "src": "mms-norm/010.wav"}, {"sys": "mms", "src": "mms/010.wav"}]}, {"i": 11, "text": "Ni 5,000 Frw gusa.", "clips": [{"sys": "mms-norm", "src": "mms-norm/011.wav"}, {"sys": "mms", "src": "mms/011.wav"}]}, {"i": 12, "text": "Yavutse 05/06/2001 mu karere ka Huye.", "clips": [{"sys": "mms-norm", "src": "mms-norm/012.wav"}, {"sys": "mms", "src": "mms/012.wav"}]}, {"i": 13, "text": "Hamagara kuri 0788123456 niba ukeneye ubufasha.", "clips": [{"sys": "mms-norm", "src": "mms-norm/013.wav"}, {"sys": "mms", "src": "mms/013.wav"}]}, {"i": 14, "text": "Umukino wa Rayon Sports na APR FC urarangiye ari ibitego bibiri kuri kimwe.", "clips": [{"sys": "mms-norm", "src": "mms-norm/014.wav"}, {"sys": "mms", "src": "mms/014.wav"}]}, {"i": 15, "text": "Perezida yakiriye abashyitsi baturutse mu bihugu bitandukanye.", "clips": [{"sys": "mms-norm", "src": "mms-norm/015.wav"}, {"sys": "mms", "src": "mms/015.wav"}]}, {"i": 16, "text": "Inka ni itungo rikomeye mu muco nyarwanda.", "clips": [{"sys": "mms", "src": "mms/016.wav"}, {"sys": "mms-norm", "src": "mms-norm/016.wav"}]}, {"i": 17, "text": "Gira inka, munyarwanda!", "clips": [{"sys": "mms-norm", "src": "mms-norm/017.wav"}, {"sys": "mms", "src": "mms/017.wav"}]}, {"i": 18, "text": "Nta mahoro nta terambere.", "clips": [{"sys": "mms", "src": "mms/018.wav"}, {"sys": "mms-norm", "src": "mms-norm/018.wav"}]}, {"i": 19, "text": "Ubumwe bw'abanyarwanda ni ishingiro ry'iterambere.", "clips": [{"sys": "mms", "src": "mms/019.wav"}, {"sys": "mms-norm", "src": "mms-norm/019.wav"}]}, {"i": 20, "text": "Ndashaka kwiga porogaramu za mudasobwa.", "clips": [{"sys": "mms-norm", "src": "mms-norm/020.wav"}, {"sys": "mms", "src": "mms/020.wav"}]}, {"i": 21, "text": "Telefone yanjye yashizemo umuriro, ndayicaginga.", "clips": [{"sys": "mms-norm", "src": "mms-norm/021.wav"}, {"sys": "mms", "src": "mms/021.wav"}]}, {"i": 22, "text": "Meeting yacu yimuriwe ejo kubera ko internet itari gukora.", "clips": [{"sys": "mms", "src": "mms/022.wav"}, {"sys": "mms-norm", "src": "mms-norm/022.wav"}]}, {"i": 23, "text": "Dr. Mukamana azatanga ikiganiro ku buzima bw'imyororokere.", "clips": [{"sys": "mms", "src": "mms/023.wav"}, {"sys": "mms-norm", "src": "mms-norm/023.wav"}]}, {"i": 24, "text": "Ese koko? Ntabwo nabyemera!", "clips": [{"sys": "mms", "src": "mms/024.wav"}, {"sys": "mms-norm", "src": "mms-norm/024.wav"}]}, {"i": 25, "text": "Yooo, mbabarira cyane, sinabimenye.", "clips": [{"sys": "mms-norm", "src": "mms-norm/025.wav"}, {"sys": "mms", "src": "mms/025.wav"}]}, {"i": 26, "text": "Umwana arira, nyina aramuhoza.", "clips": [{"sys": "mms-norm", "src": "mms-norm/026.wav"}, {"sys": "mms", "src": "mms/026.wav"}]}, {"i": 27, "text": "Amazi ni ubuzima.", "clips": [{"sys": "mms", "src": "mms/027.wav"}, {"sys": "mms-norm", "src": "mms-norm/027.wav"}]}, {"i": 28, "text": "Mu mwaka wa 2024, abaturage basaga miliyoni cumi n'eshatu.", "clips": [{"sys": "mms-norm", "src": "mms-norm/028.wav"}, {"sys": "mms", "src": "mms/028.wav"}]}, {"i": 29, "text": "Twese hamwe, dushobora kugera kure.", "clips": [{"sys": "mms-norm", "src": "mms-norm/029.wav"}, {"sys": "mms", "src": "mms/029.wav"}]}];
const KEY = "kin-tts-ratings";
let ratings = {};
try { ratings = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ratings)); } catch (e) {} };
const total = DATA.reduce((n, d) => n + d.clips.length, 0);
const progress = () => document.getElementById("progress").textContent = `${Object.keys(ratings).length} / ${total} rated`;
const list = document.getElementById("list");
for (const item of DATA) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="text">${item.i + 1}. ${item.text.replace(/</g, "&lt;")}</div>`;
  item.clips.forEach((c, k) => {
    const id = `${item.i}|${c.sys}`;
    const row = document.createElement("div");
    row.className = "clip";
    row.innerHTML = `<span class="label">${"ABCDEFGH"[k]}</span><audio controls preload="none" src="${c.src}"></audio><span class="stars"></span>`;
    const stars = row.querySelector(".stars");
    for (let s = 1; s <= 5; s++) {
      const b = document.createElement("button");
      b.textContent = s;
      if (ratings[id] === s) b.classList.add("on");
      b.onclick = () => {
        ratings[id] = s; save(); progress();
        stars.querySelectorAll("button").forEach((x, j) => x.classList.toggle("on", j + 1 === s));
      };
      stars.appendChild(b);
    }
    el.appendChild(row);
  });
  list.appendChild(el);
}
progress();
document.getElementById("export").onclick = () => {
  const rater = document.getElementById("rater").value || "anonymous";
  const rows = [["rater", "sentence", "system", "score"]];
  for (const [id, s] of Object.entries(ratings)) { const [i, sys] = id.split("|"); rows.push([rater, i, sys, s]); }
  const blob = new Blob([rows.map(r => r.join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `ratings-${rater}.csv`; a.click();
};
</script>
</body>
</html>
